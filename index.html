<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesquisa Culturama</title>
  </head>
  <body>
    <header>
      <h1>Pesquisa online</h1>
    </header>

    <section>
      <form action="" method="get">
        <fieldset>
          <legend>Dados pessoais</legend>

          <label for="userName">Nome: </label>
          <input type="text" name="userName" required />
          <br />

          <label for="userAge">Idade: </label>
          <input
            type="number"
            name="userAge"
            max="100"
            min="12"
            value="12"
            required
          />
          <br />

          <label for="userBirthDate">Data de nascimento: </label>
          <input type="date" name="userBirthDate" />
          <br />

          <label for="userEmail">E-mail: </label>
          <input type="email" name="userEmail" required />
          <br />

          <label for="userPhoneNumber">Telefone: </label>
          <input
            type="tel"
            name="userPhoneNumber"
            pattern="[0-9]{11}"
            placeholder="Ex: 00000000000"
          />
          <br />

          <label for="userImage">Upload de foto: </label>
          <input type="file" name="userImage" accept="image/*" />
          <br />
        </fieldset>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
      </form>
    </section>
  </body>
</html>
